name: Two fixed car cases (single attempt each)
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Fixed opaque case slot
        required: true
        type: choice
        options: [car1, car2]
      confirm:
        description: TWO_CAR_ONCE
        required: true
        type: string
      other_writers_fenced:
        description: CONFIRMED
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: live-emulator-e2e
  cancel-in-progress: false
jobs:
  trial:
    # Owner-approved single encrypted package; durable create-only claim prevents replay.
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.confirm == 'TWO_CAR_ONCE' && inputs.other_writers_fenced == 'CONFIRMED' }}
    environment: m0-trial-submit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate dispatch boundary before secrets
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
          FENCE_INPUT: ${{ inputs.other_writers_fenced }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM_INPUT" = TWO_CAR_ONCE
          test "$FENCE_INPUT" = CONFIRMED
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build production bridge and locked tooling before secrets
        run: |
          sh scripts/verify_bridge_wrapper.sh
          sh gradlew -p api-bridge --no-daemon --dependency-verification strict test writeBatchBridgeClasspath
          python3 -m venv /tmp/api-trial-venv
          /tmp/api-trial-venv/bin/pip install --require-hashes -r requirements-lock.txt
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y strongswan xl2tpd ppp > /dev/null 2>&1
      - name: Mandatory VPN before any municipal request
        env:
          VPN_L2TP_SERVER: ${{ secrets.VPN_L2TP_SERVER }}
          VPN_L2TP_PSK: ${{ secrets.VPN_L2TP_PSK }}
          VPN_L2TP_USERNAME: ${{ secrets.VPN_L2TP_USERNAME }}
          VPN_L2TP_PASSWORD: ${{ secrets.VPN_L2TP_PASSWORD }}
        run: sudo --preserve-env=VPN_L2TP_SERVER,VPN_L2TP_PSK,VPN_L2TP_USERNAME,VPN_L2TP_PASSWORD python3 trial/l2tp.py up-bounded
      - name: One privately claimed API trial, no retries or fallback
        env:
          CAR_CI_AUTHORIZED: ${{ inputs.confirm }}
          CAR_SLOT: ${{ inputs.slot }}
          TRIAL_OTHER_WRITERS_FENCED: ${{ inputs.other_writers_fenced }}
          # Same fixed-private-repo contents read/write token, fetch alias is NOT read-only scope.
          # Token split tracked in issue607; no credential provisioning in this scaffold.
          PRIVATE_LOOKUP_READ_TOKEN: ${{ secrets.BATCH_PRIVATE_CONTENTS_TOKEN }}
          BATCH_PRIVATE_CONTENTS_TOKEN: ${{ secrets.BATCH_PRIVATE_CONTENTS_TOKEN }}
          TRIAL_DATA_KEY: ${{ secrets.TRIAL_DATA_KEY }}
          J106_SUBSCRIPTION_KEY: ${{ secrets.J106_SUBSCRIPTION_KEY }}
          J106_APP_USERNAME: ${{ secrets.J106_APP_USERNAME }}
          J106_APP_PASSWORD: ${{ secrets.J106_APP_PASSWORD }}
          REPORTER_FIRST_NAME: ${{ secrets.REPORTER_FIRST_NAME }}
          REPORTER_LAST_NAME: ${{ secrets.REPORTER_LAST_NAME }}
          REPORTER_PHONE: ${{ secrets.REPORTER_PHONE }}
          REPORTER_ID_NUMBER: ${{ secrets.REPORTER_ID_NUMBER }}
          REPORTER_EMAIL: ${{ secrets.REPORTER_EMAIL }}
        run: /tmp/api-trial-venv/bin/python scripts/two_car_ci.py
      - name: Encrypt all private diagnostics even on refusal or uncertainty
        if: always()
        env:
          TRIAL_DATA_KEY: ${{ secrets.TRIAL_DATA_KEY }}
        run: |
          set -euo pipefail
          trap 'shred -u /tmp/supervised-api-trial-evidence.tgz 2>/dev/null || true' EXIT
          if [ -d /tmp/supervised-api-trial ]; then
            tar czf /tmp/supervised-api-trial-evidence.tgz -C /tmp/supervised-api-trial .
            openssl enc -aes-256-cbc -pbkdf2 -md sha256 -iter 200000 -salt -in /tmp/supervised-api-trial-evidence.tgz -out /tmp/supervised-api-trial-evidence.tgz.enc -pass env:TRIAL_DATA_KEY
            test -s /tmp/supervised-api-trial-evidence.tgz.enc
            shred -u /tmp/supervised-api-trial-evidence.tgz
          fi
      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: two-car-case-encrypted
          path: /tmp/supervised-api-trial-evidence.tgz.enc
          if-no-files-found: warn
          retention-days: 14
      - name: Always remove VPN and private staging
        if: always()
        run: |
          sudo python3 trial/l2tp.py down || true
          rm -rf /tmp/supervised-api-trial
          shred -u /tmp/supervised-api-trial-evidence.tgz 2>/dev/null || true
