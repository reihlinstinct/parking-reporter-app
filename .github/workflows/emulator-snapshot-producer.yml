name: Emulator snapshot producer

# Issue #548. Builds a CLEAN AVD snapshot (booted, app and test APK installed,
# nothing private) and publishes it to the Actions cache under an exact key.
# No secrets, no environments, no private data, no municipal traffic. Public
# Linux runners are free. The key carries a 2-day epoch, so a new snapshot is
# built at least every 2 days (the requirement is 3) and also whenever the
# emulator, image, runner image, app sources or this file change. Consumers
# re-check the 72 hour age on every restore. Not used by the live workflow yet.

on:
  schedule:
    # Daily, off the hour. The key epoch makes all but one run per 2 days a no-op.
    - cron: '23 1 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      allow-trial-ref:
        description: Mock benchmark only. Publishes under the calling branch ref.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: emulator-snapshot-producer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  produce:
    # Trusted producer is main. The benchmark may call it from its own branch
    # with allow-trial-ref; GitHub scopes that branch's cache to the branch.
    if: github.ref == 'refs/heads/main' || inputs.allow-trial-ref == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      key: ${{ steps.key.outputs.key }}
      built: ${{ steps.exists.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - id: key
        uses: ./.github/actions/emulator-snapshot-key
      - name: Skip when this exact key already exists
        id: exists
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Enable KVM
        if: steps.exists.outputs.cache-hit != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs (no secrets in this job)
        if: steps.exists.outputs.cache-hit != 'true'
        run: |
          sh scripts/prepare_wrapper.sh
          sh gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Create, prepare and cleanly shut down the snapshot
        if: steps.exists.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          force-avd-creation: true
          # Default options plus a snapshot save on exit. No network tunnel here.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            echo "Generated clean AVD snapshot."
      - name: Verify content and write provenance manifest
        if: steps.exists.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python3 scripts/emulator_snapshot_cache.py write-manifest --avd-dir "$HOME/.android/avd"
      - name: Publish (exact key, AVD directory allowlist only)
        if: steps.exists.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: ${{ steps.key.outputs.key }}
      - name: Summary (fixed markers only)
        run: |
          echo "snapshot key: ${{ steps.key.outputs.key }}" >> "$GITHUB_STEP_SUMMARY"
          echo "built this run: ${{ steps.exists.outputs.cache-hit != 'true' }}" >> "$GITHUB_STEP_SUMMARY"
