name: Repository checks

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Scaffolding and policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
        with:
          persist-credentials: false
      - name: Check repository foundation
        run: python3 scripts/check_repository.py
      # Android build, unit and emulator/e2e jobs belong to M1.
      # This workflow never uses secrets or calls the municipal API.
