name: Hybrid batch preparation (inactive, no municipal writes)
on:
  workflow_dispatch:
    inputs:
      private_data_commit:
        description: Full immutable private data commit SHA
        required: true
        type: string
      batch_path:
        description: Fixed private repo batches/<id>/input.zip[.enc]
        required: true
        type: string
      approved_outer_sha256:
        description: Owner-bound exact package SHA256, generated by packager
        required: true
        type: string
      approved_inner_sha256:
        description: Independently approved decrypted ZIP SHA256
        required: true
        type: string
      approved_addresses_sha256:
        description: Independently approved address directory SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # Must match the existing UI live route. Serialize private preparation; no municipal writes in this inactive workflow.
  group: live-emulator-e2e
  cancel-in-progress: false
jobs:
  prepare-only:
    # Hard disabled until a separately reviewed activation verifies environment
    # reviewer protection and all private-data/operational gates. No secret job
    # may start from workflow_dispatch while this route is inactive.
    if: ${{ false }}
    environment: m0-trial-submit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build bridge before private injection (does not run it)
        run: |
          sh scripts/prepare_wrapper.sh
          sh gradlew --no-daemon :app:writeBatchBridgeClasspath
      - name: Prepare verified private input only
        env:
          BATCH_PRIVATE_REF: ${{ inputs.private_data_commit }}
          BATCH_PRIVATE_PATH: ${{ inputs.batch_path }}
          BATCH_APPROVED_OUTER_SHA256: ${{ inputs.approved_outer_sha256 }}
          BATCH_APPROVED_INNER_SHA256: ${{ inputs.approved_inner_sha256 }}
          BATCH_APPROVED_ADDRESSES_SHA256: ${{ inputs.approved_addresses_sha256 }}
          PRIVATE_LOOKUP_READ_TOKEN: ${{ secrets.BATCH_PRIVATE_CONTENTS_TOKEN }}
          TRIAL_DATA_KEY: ${{ secrets.TRIAL_DATA_KEY }}
          TRIAL_STREET_LOOKUP_JSON: ${{ secrets.TRIAL_STREET_LOOKUP_JSON }}
          BATCH_VERIFIED_TOPIC_POLICY: ${{ secrets.BATCH_VERIFIED_TOPIC_POLICY }}
        run: python3 scripts/prepare_hybrid_batch.py
      - name: Upload encrypted preparation evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hybrid-preparation-encrypted
          path: /tmp/hybrid-prepared/effective.json.enc
          if-no-files-found: warn
          retention-days: 14
      - name: Remove private staging
        if: always()
        run: rm -rf /tmp/hybrid-prepared
      - name: Explicit no-write boundary
        run: echo 'BATCH_PREPARATION_ONLY_NO_SUBMISSION'
