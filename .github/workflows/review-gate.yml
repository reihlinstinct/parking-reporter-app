name: Review gate
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ['Review notification']
    types: [completed]
permissions:
  contents: read
concurrency:
  # Serialize all writers so a stale run cannot overwrite a newer review result.
  group: independent-review-status-writer
  cancel-in-progress: false
jobs:
  gate:
    if: github.repository == 'reihlinstinct/parking-reporter-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted base only, never PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Write status to exact live head
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -I scripts/ci/review_gate.py
