name: API29 retained heap diagnostic
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/api29-memory.yml'
      - 'scripts/api29_memory_diagnostic.sh'
      - 'app/src/androidTest/java/io/github/reihlinstinct/reporter/MemoryTraceListener.kt'
permissions:
  contents: read
concurrency:
  group: api29-memory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [suite, fresh-suite, snapshots, isolated, paired, boot-probe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: sh scripts/prepare_wrapper.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '29'
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p app/build/reports/api29-memory
            adb logcat -b all -d -v threadtime > app/build/reports/api29-memory/initial-boot-logcat.txt
            adb shell cat /vendor/etc/init/hw/init.ranchu.rc > app/build/reports/api29-memory/init-ranchu.txt
            adb shell cat /init.rc > app/build/reports/api29-memory/init-main.txt
            adb shell cat /system/build.prop > app/build/reports/api29-memory/system-build-properties.txt
            sh gradlew --no-daemon assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            sh gradlew --stop || true
            python3 scripts/emulator_preflight.py --report-dir app/build/reports/api29-memory
            adb shell svc wifi disable
            adb shell svc data disable
            if [ '${{ matrix.mode }}' = boot-probe ]; then
              python3 scripts/api29_boot_probe.py
            else
              bash scripts/api29_memory_diagnostic.sh ${{ matrix.mode }}
            fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: api29-memory-${{ matrix.mode }}
          path: app/build/reports/api29-memory/
          if-no-files-found: error
          retention-days: 7

  summary:
    permissions:
      contents: read
    name: API29 memory summary
    if: always()
    needs: [diagnose]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
      - name: Fail on failed or cancelled dependencies
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Deliberate docs-only skips are allowed; a failed or cancelled
          # dependency must fail this gate.
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if bad:
              print("Dependencies failed or cancelled:", bad)
              sys.exit(1)
          print("All dependencies succeeded or were deliberately skipped.")
          PY
