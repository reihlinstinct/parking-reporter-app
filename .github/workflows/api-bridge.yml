name: Standalone API bridge (offline tests)
on:
  pull_request:
    paths:
      - 'api-bridge/**'
      - 'scripts/dependency_cache_size.py'
      - 'scripts/test_dependency_caches.py'
      - 'app/src/main/java/io/github/reihlinstinct/reporter/municipal/**'
      - 'app/src/main/java/io/github/reihlinstinct/reporter/core/**'
      - 'app/src/test/java/io/github/reihlinstinct/reporter/municipal/**'
      - 'app/src/test/resources/**'
      - 'scripts/jvm/**'
      - 'scripts/verify_bridge_wrapper.sh'
      - 'scripts/test_kotlin_plugin_marker.py'
      - 'scripts/supervised_api_trial.py'
      - 'scripts/test_supervised_api_trial.py'
      - 'scripts/two_car_ci*'
      - 'scripts/test_two_car_ci.py'
      - 'scripts/submission_branch.py'
      - 'scripts/test_submission_branch.py'
      - '.github/workflows/submission-branch.yml'
      - '.github/workflows/two-car-ci.yml'
      - 'trial/**'
      - 'requirements-lock.txt'
      - '.github/workflows/api-bridge.yml'
      - '.github/workflows/supervised-api-trial.yml'
      - 'gradle/wrapper/**'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore exact dependency-only cache
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/**/*.lock
          key: ${{ runner.os }}-${{ runner.arch }}-bridge-modules-v1-${{ hashFiles('api-bridge/*.gradle.kts', 'api-bridge/gradle/verification-metadata.xml', 'gradle/wrapper/**') }}
      - name: Compile exact production bridge, run synthetic tests, resolve real runtime
        run: |
          set -euo pipefail
          python3 scripts/test_kotlin_plugin_marker.py
          sh scripts/verify_bridge_wrapper.sh
          sh gradlew -p api-bridge --no-daemon --dependency-verification strict --info test writeBatchBridgeClasspath
          python3 scripts/test_submission_branch.py
          python3 scripts/test_two_car_ci.py
          python3 scripts/test_supervised_api_trial.py
          test -s app/build/batch-bridge/classpath.txt
          # No credentials: prove the actual main class loads and fails closed.
          java -cp "$(cat app/build/batch-bridge/classpath.txt)" io.github.reihlinstinct.reporter.municipal.SupervisedApiTrialBridge | grep -Fx '{"success":false,"error":"SUPERVISED_TRIAL_UNAVAILABLE"}'
          sh gradlew -p api-bridge --no-daemon --dependency-verification strict writeBatchBridgeClasspath --dry-run > /tmp/bridge-task-graph.txt
          if grep -E ':app:|Android|ksp|compose|OCR' /tmp/bridge-task-graph.txt; then exit 1; fi
          # Positive control: the same expression must detect a synthetic app task.
          printf '%s\n' ':app:compileDebugKotlin' > /tmp/bridge-positive-task.txt
          grep -Eq ':app:|Android|ksp|compose|OCR' /tmp/bridge-positive-task.txt

      # Only successful trusted-main jobs publish. PRs/matrices are readers.
      - name: Bound dependency cache before publishing
        id: dependency-cache-size
        continue-on-error: true
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dependency-cache.outputs.cache-hit != 'true'
        run: python3 scripts/dependency_cache_size.py
      - name: Publish exact successful dependency-only cache
        continue-on-error: true
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dependency-cache.outputs.cache-hit != 'true' && steps.dependency-cache-size.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/**/*.lock
          key: ${{ runner.os }}-${{ runner.arch }}-bridge-modules-v1-${{ hashFiles('api-bridge/*.gradle.kts', 'api-bridge/gradle/verification-metadata.xml', 'gradle/wrapper/**') }}
