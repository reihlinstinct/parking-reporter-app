name: Scorecard supply-chain security
on:
  branch_protection_rule:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Saturday scan
    - cron: "30 1 * * 6"

permissions: read-all

jobs:
  guard:
    name: Scorecard regression guard
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Offline guard and self-tests
        run: |
          python3 -m unittest discover -s tests/security -p test_scorecard_guard.py -v
          python3 scripts/security/scorecard_guard.py
  analysis:
    if: github.event_name != 'pull_request'
    needs: guard
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      # Needed to upload results to the code scanning dashboard
      security-events: write
      # Needed for publish_results (OpenSSF REST API)
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif

  summary:
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: read
    name: Run summary
    needs: [analysis]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
