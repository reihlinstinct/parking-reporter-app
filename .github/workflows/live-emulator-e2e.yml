name: Live emulator E2E (owner-approved)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type FILE-LIVE-REPORT to file ONE real case through the app UI with the staged TRIAL_* data'
        required: true
        type: string
      approved_sha256:
        description: 'sha256 of the exact owner-approved Hebrew text (must match the staged TRIAL_APPROVED_TEXT)'
        required: true
        type: string
      category_label:
        description: 'Category picker label to select during review'
        required: false
        default: 'חניה על המדרכה'
        type: string

permissions:
  contents: read
concurrency:
  group: live-emulator-e2e
  cancel-in-progress: false

jobs:
  # One real submission through the real app UI in an emulator, recorded.
  # Gated by the m0-trial-submit environment (required reviewer: the owner),
  # by the confirm phrase and by the approved-text digest binding. Evidence
  # (screen recording, screenshots, raw instrumentation output) is uploaded
  # only openssl-encrypted with TRIAL_DATA_KEY; the public log carries only
  # the scrubbed LIVE_E2E markers the test writes.
  live-e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: m0-trial-submit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: sh scripts/prepare_wrapper.sh
      - name: Validate dispatch inputs before any secret is read
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
          APPROVED_SHA256_INPUT: ${{ inputs.approved_sha256 }}
        run: |
          # The dispatch values reach the shell only as quoted env vars,
          # never through workflow-expression interpolation.
          test "$CONFIRM_INPUT" = 'FILE-LIVE-REPORT' || { echo 'confirm input mismatch - refusing to run'; exit 1; }
          printf '%s' "$APPROVED_SHA256_INPUT" | grep -qxE '[0-9a-f]{64}'
      - name: Build app and test APKs
        run: sh gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Egress probe (login-only, no case writes)
        id: probe
        continue-on-error: true
        env:
          J106_LIVE_TRIAL: login-only
          J106_SUBSCRIPTION_KEY: ${{ secrets.J106_SUBSCRIPTION_KEY }}
          J106_APP_USERNAME: ${{ secrets.J106_APP_USERNAME }}
          J106_APP_PASSWORD: ${{ secrets.J106_APP_PASSWORD }}
          TRIAL_STATE_DIR: /tmp/trial-state
          TRIAL_RESULT_PATH: /tmp/trial-result.txt
          EGRESS_MARKER_PATH: /tmp/egress-blocked
        run: |
          sh gradlew --no-daemon testDebugUnitTest --tests 'il.sidewalks.reporter.municipal.EngineLiveTrialTest'
      - name: Bring up owner L2TP fallback (only after proven egress block)
        id: vpn
        if: steps.probe.outcome == 'failure'
        env:
          VPN_L2TP_SERVER: ${{ secrets.VPN_L2TP_SERVER }}
          VPN_L2TP_PSK: ${{ secrets.VPN_L2TP_PSK }}
          VPN_L2TP_USERNAME: ${{ secrets.VPN_L2TP_USERNAME }}
          VPN_L2TP_PASSWORD: ${{ secrets.VPN_L2TP_PASSWORD }}
        run: |
          # The marker is written by the probe only when login failed with a
          # 403 or a connect failure, i.e. no case write was attempted. Any
          # other failure must not retry anything.
          if [ ! -f /tmp/egress-blocked ]; then
            echo 'no egress-blocked marker: probe failure was not a proven egress block, no fallback'
            echo 'ready=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y strongswan xl2tpd ppp > /dev/null 2>&1
          sudo --preserve-env=VPN_L2TP_SERVER,VPN_L2TP_PSK,VPN_L2TP_USERNAME,VPN_L2TP_PASSWORD \
            python3 trial/l2tp.py up-bounded
          echo 'ready=1' >> "$GITHUB_OUTPUT"
      - name: Re-probe through the tunnel (login-only)
        if: steps.vpn.outputs.ready == '1'
        env:
          J106_LIVE_TRIAL: login-only
          J106_SUBSCRIPTION_KEY: ${{ secrets.J106_SUBSCRIPTION_KEY }}
          J106_APP_USERNAME: ${{ secrets.J106_APP_USERNAME }}
          J106_APP_PASSWORD: ${{ secrets.J106_APP_PASSWORD }}
          TRIAL_STATE_DIR: /tmp/trial-state
          TRIAL_RESULT_PATH: /tmp/trial-result.txt
        run: |
          rm -f /tmp/trial-result.txt
          sh gradlew --no-daemon testDebugUnitTest --tests 'il.sidewalks.reporter.municipal.EngineLiveTrialTest'
          grep -q 'TRIAL_RESULT LOGIN_OK' /tmp/trial-result.txt
      - name: Fail when the probe failed without a proven egress block
        if: steps.probe.outcome == 'failure' && steps.vpn.outputs.ready != '1'
        run: exit 1
      - name: Decrypt the staged trial photo
        env:
          TRIAL_DATA_KEY: ${{ secrets.TRIAL_DATA_KEY }}
        run: |
          umask 077
          mkdir -p /tmp/live-e2e
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in trial/trial-photo.jpg.enc -out /tmp/live-e2e/photo.jpg -pass env:TRIAL_DATA_KEY
          test -s /tmp/live-e2e/photo.jpg
      - name: Stage live params (private)
        env:
          J106_SUBSCRIPTION_KEY: ${{ secrets.J106_SUBSCRIPTION_KEY }}
          J106_APP_USERNAME: ${{ secrets.J106_APP_USERNAME }}
          J106_APP_PASSWORD: ${{ secrets.J106_APP_PASSWORD }}
          REPORTER_FIRST_NAME: ${{ secrets.REPORTER_FIRST_NAME }}
          REPORTER_LAST_NAME: ${{ secrets.REPORTER_LAST_NAME }}
          REPORTER_PHONE: ${{ secrets.REPORTER_PHONE }}
          REPORTER_ID_NUMBER: ${{ secrets.REPORTER_ID_NUMBER }}
          REPORTER_EMAIL: ${{ secrets.REPORTER_EMAIL }}
          TRIAL_APPROVED_TEXT: ${{ secrets.TRIAL_APPROVED_TEXT }}
          TRIAL_PLATE: ${{ secrets.TRIAL_PLATE }}
          TRIAL_ADDRESS: ${{ secrets.TRIAL_ADDRESS }}
          TRIAL_LAT: ${{ secrets.TRIAL_LAT }}
          TRIAL_LON: ${{ secrets.TRIAL_LON }}
          TRIAL_CAPTURED_AT: ${{ secrets.TRIAL_CAPTURED_AT }}
          APPROVED_SHA256_INPUT: ${{ inputs.approved_sha256 }}
          CATEGORY_LABEL: ${{ inputs.category_label }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/live-e2e
          python3 - <<'PY'
          import hashlib, json, os, sys
          text = os.environ["TRIAL_APPROVED_TEXT"]
          digest = hashlib.sha256(text.encode("utf-8")).hexdigest()
          if digest != os.environ["APPROVED_SHA256_INPUT"].lower():
              sys.exit("approved text digest mismatch - refusing to stage")
          params = {
              "subscriptionKey": os.environ["J106_SUBSCRIPTION_KEY"],
              "username": os.environ["J106_APP_USERNAME"],
              "password": os.environ["J106_APP_PASSWORD"],
              "firstName": os.environ["REPORTER_FIRST_NAME"],
              "lastName": os.environ["REPORTER_LAST_NAME"],
              "phone": os.environ["REPORTER_PHONE"],
              "idNumber": os.environ["REPORTER_ID_NUMBER"],
              "email": os.environ["REPORTER_EMAIL"],
              "text": text,
              "approvedSha256": digest,
              "plate": os.environ.get("TRIAL_PLATE", ""),
              "address": os.environ["TRIAL_ADDRESS"],
              "lat": os.environ["TRIAL_LAT"],
              "lon": os.environ["TRIAL_LON"],
              "capturedAt": os.environ["TRIAL_CAPTURED_AT"],
              "categoryLabel": os.environ.get("CATEGORY_LABEL") or "חניה על המדרכה",
          }
          with open("/tmp/live-e2e/params.json", "w", encoding="utf-8") as fh:
              json.dump(params, fh, ensure_ascii=False)
          print("params staged (values withheld)")
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the live submission in the emulator (screen recorded)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # The emulator action runs every script line in its own sh: no
          # variables, background jobs or shell options survive across lines.
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell "run-as il.sidewalks.reporter.test sh -c 'cat > files/live-photo.jpg'" < /tmp/live-e2e/photo.jpg
            adb shell "run-as il.sidewalks.reporter sh -c 'cat > files/live-params.json'" < /tmp/live-e2e/params.json
            ( for i in 1 2 3 4 5 6; do if [ -f /tmp/live-e2e/stop-rec ]; then break; fi; adb shell screenrecord --time-limit 170 /sdcard/live-rec-$i.mp4 >/dev/null 2>&1; done ) &
            adb shell am instrument -w -r -e class il.sidewalks.reporter.live.LiveEmulatorSubmissionTest il.sidewalks.reporter.test/androidx.test.runner.AndroidJUnitRunner > /tmp/live-e2e/instrumentation.txt 2>&1; echo $? > /tmp/live-e2e/instrumentation.rc
            touch /tmp/live-e2e/stop-rec
            adb shell pkill -INT screenrecord || true
            sleep 3
            adb pull /sdcard/live-rec-1.mp4 /tmp/live-e2e/seg1.mp4 || true
            adb pull /sdcard/live-rec-2.mp4 /tmp/live-e2e/seg2.mp4 || true
            adb pull /sdcard/live-rec-3.mp4 /tmp/live-e2e/seg3.mp4 || true
            adb pull /sdcard/live-rec-4.mp4 /tmp/live-e2e/seg4.mp4 || true
            adb pull /sdcard/live-rec-5.mp4 /tmp/live-e2e/seg5.mp4 || true
            adb pull /sdcard/live-rec-6.mp4 /tmp/live-e2e/seg6.mp4 || true
            adb shell rm -f /sdcard/live-rec-1.mp4 /sdcard/live-rec-2.mp4 /sdcard/live-rec-3.mp4 /sdcard/live-rec-4.mp4 /sdcard/live-rec-5.mp4 /sdcard/live-rec-6.mp4 || true
            adb shell "run-as il.sidewalks.reporter cat files/live-e2e-log.txt" > /tmp/live-e2e/live-log.txt || true
            adb shell "run-as il.sidewalks.reporter cat files/live-e2e-approved.png" > /tmp/live-e2e/approved.png || true
            adb shell "run-as il.sidewalks.reporter cat files/live-e2e-submitted.png" > /tmp/live-e2e/submitted.png || true
            adb shell "run-as il.sidewalks.reporter rm -f files/live-params.json files/live-e2e-approved.png files/live-e2e-submitted.png" || true
            adb shell "run-as il.sidewalks.reporter.test rm -f files/live-photo.jpg" || true
      - name: Encrypt the recording and raw output
        if: always()
        env:
          TRIAL_DATA_KEY: ${{ secrets.TRIAL_DATA_KEY }}
        run: |
          set -euo pipefail
          cd /tmp/live-e2e
          : > segments.txt
          for f in seg1.mp4 seg2.mp4 seg3.mp4 seg4.mp4 seg5.mp4 seg6.mp4; do
            if [ -s "$f" ]; then printf "file '%s'\n" "$PWD/$f" >> segments.txt; fi
          done
          if [ -s segments.txt ]; then
            ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i segments.txt -c copy recording.mp4 || true
          fi
          if [ ! -s recording.mp4 ] && [ -s segments.txt ]; then
            first=$(sed -n "s|^file '\(/.*\)'|\1|p" segments.txt | head -1)
            cp "$first" recording.mp4
          fi
          test -s instrumentation.txt
          tar czf private-bundle.tgz $(ls recording.mp4 instrumentation.txt approved.png submitted.png 2>/dev/null)
          test -s private-bundle.tgz
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in private-bundle.tgz -out live-e2e-private-bundle.tgz.enc -pass env:TRIAL_DATA_KEY
          test -s live-e2e-private-bundle.tgz.enc
          shred -u private-bundle.tgz recording.mp4 seg1.mp4 seg2.mp4 seg3.mp4 seg4.mp4 seg5.mp4 seg6.mp4 approved.png submitted.png instrumentation.txt 2>/dev/null || true
      - name: Upload the encrypted evidence bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-e2e-private-bundle-encrypted
          path: /tmp/live-e2e/live-e2e-private-bundle.tgz.enc
          if-no-files-found: error
          retention-days: 14
      - name: Upload the scrubbed marker log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-e2e-scrubbed-log
          path: /tmp/live-e2e/live-log.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Publish scrubbed markers to the run log and summary
        if: always()
        run: |
          cat /tmp/live-e2e/live-log.txt 2>/dev/null || echo 'no scrubbed markers produced'
          { echo '## Live emulator E2E (scrubbed markers)'; echo; echo '```'; cat /tmp/live-e2e/live-log.txt 2>/dev/null || echo 'none'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: "Verdict: the run must reach SUBMITTED"
        run: |
          test "$(cat /tmp/live-e2e/instrumentation.rc)" = "0"
          grep -q 'LIVE_E2E SUBMITTED case=' /tmp/live-e2e/live-log.txt
      - name: Always remove the tunnel and staged plaintext
        if: always()
        run: |
          sudo python3 trial/l2tp.py down || true
          rm -f /tmp/egress-blocked
          rm -rf /tmp/trial-state /tmp/trial-result.txt
          shred -u /tmp/live-e2e/photo.jpg /tmp/live-e2e/params.json 2>/dev/null || true
          rm -rf /tmp/live-e2e
