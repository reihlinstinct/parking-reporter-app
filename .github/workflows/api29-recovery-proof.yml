name: API29 bounded recovery proof
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/api29-recovery-proof.yml'
      - 'scripts/api29_recovery_proof.py'
      - 'tests/test_api29_recovery_proof.py'
permissions:
  contents: read
concurrency:
  group: api29-recovery-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: sh scripts/prepare_wrapper.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '29'
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p app/build/reports/api29-recovery
            sh gradlew --no-daemon assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            sh gradlew --stop || true
            python3 scripts/api29_recovery_proof.py --report-dir app/build/reports/api29-recovery
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w -r il.sidewalks.reporter.test/androidx.test.runner.AndroidJUnitRunner > app/build/reports/api29-recovery/instrumentation.txt 2>&1; echo $? > app/build/reports/api29-recovery/instrumentation.rc; cat app/build/reports/api29-recovery/instrumentation.txt
            adb logcat -b all -d -v threadtime > app/build/reports/api29-recovery/logcat.txt
            python3 scripts/test_summary.py --title 'API29 bounded recovery proof, full suite once' --instrumentation app/build/reports/api29-recovery/instrumentation.txt --check
            test "$(cat app/build/reports/api29-recovery/instrumentation.rc)" = "0"
      - name: Explain proof result without upgrading an unreproduced race
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('app/build/reports/api29-recovery/recovery-proof.json')
          result = json.loads(path.read_text()) if path.exists() else {'status': 'incomplete'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Recovery control\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n\n')
              out.write('Only recovered plus a passing full suite proves recovery. Not-reproduced or incomplete is not recovery evidence.\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: api29-recovery-proof
          path: app/build/reports/api29-recovery/
          if-no-files-found: warn
          retention-days: 7
