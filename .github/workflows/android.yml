name: Official manual AppFunctions invocation proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recording:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: sh scripts/prepare_wrapper.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: android/appfunctions
          ref: 8f10403d8908f0621227263b1c07419342dacaf6
          path: official-appfunctions
          persist-credentials: false
      - name: Build official testing agent standard flavor without an API key
        run: |
          cd official-appfunctions/agent
          chmod +x gradlew
          ./gradlew --no-daemon assembleStandardDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record available device profiles
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device'
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            sh gradlew --no-daemon assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            sh gradlew --stop || true
            python3 scripts/emulator_preflight.py --report-dir app/build/reports/assistant-invocation
            adb shell am instrument -w -r -e class io.github.reihlinstinct.reporter.AssistantManualAgentSetupTest#enableForOfficialManualAgent il.sidewalks.reporter.test/androidx.test.runner.AndroidJUnitRunner > app/build/reports/assistant-invocation/setup.txt 2>&1
            python3 scripts/test_summary.py --title 'Enable fresh emulator for official manual agent' --instrumentation app/build/reports/assistant-invocation/setup.txt --check
            adb install -r official-appfunctions/agent/app/build/outputs/apk/standard/debug/app-standard-debug.apk
            adb shell cmd app_function help > app/build/reports/assistant-invocation/cmd-help.txt 2>&1 || true
            adb shell cmd app_function list-app-functions --package il.sidewalks.reporter > app/build/reports/assistant-invocation/cmd-list.txt 2>&1 || true
            FUNCTION_ID=$(adb shell run-as il.sidewalks.reporter cat files/manual-agent-function-id.txt | tr -d '\r')
            adb shell cmd app_function execute-app-function --package il.sidewalks.reporter --function "$FUNCTION_ID" --parameters '{}' > app/build/reports/assistant-invocation/cmd-execute.txt 2>&1 || true
            adb shell "screenrecord --time-limit 120 /sdcard/assistant-invocation.mp4 >/dev/null 2>&1 &"
            (cd official-appfunctions/agent && bash startAppFunctionTestingAgent)
            python3 scripts/assistant_agent_manual_proof.py
            adb shell pkill -INT screenrecord || true
            sleep 2
            adb pull /sdcard/assistant-invocation.mp4 app/build/reports/assistant-invocation/assistant-invocation.mp4 || true
            adb shell am force-stop com.example.appfunctions.agent
            adb shell am instrument -w -r -e class io.github.reihlinstinct.reporter.AssistantManualAgentSetupTest#revokeAfterOfficialManualAgent il.sidewalks.reporter.test/androidx.test.runner.AndroidJUnitRunner > app/build/reports/assistant-invocation/revoke.txt 2>&1
            python3 scripts/test_summary.py --title 'Revoke official manual agent entry' --instrumentation app/build/reports/assistant-invocation/revoke.txt --check
            adb logcat -d -v threadtime > app/build/reports/assistant-invocation/logcat.txt || true
            python3 -c 'import json; r=json.load(open("app/build/reports/assistant-invocation/manual-agent-result.json")); assert r["official_agent_manual"], r'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: assistant-invocation-api36
          path: app/build/reports/assistant-invocation/
          retention-days: 14
          if-no-files-found: error
