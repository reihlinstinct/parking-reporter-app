name: Android build and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - run: sh scripts/prepare_wrapper.sh
      - run: sh gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Unit test coverage (JaCoCo)
        if: always()
        continue-on-error: true
        run: sh gradlew --no-daemon jacocoDebugUnitTestReport
      - name: Unit test summary
        if: always()
        run: python3 scripts/test_summary.py --title 'Unit tests (debug)' --junit app/build/test-results/testDebugUnitTest --jacoco app/build/reports/jacoco
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: m1-preview-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build smaller arm64 phone preview
        run: sh gradlew --no-daemon clean assembleDebug -PpreviewArm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phone-arm64-preview-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - run: sh scripts/prepare_wrapper.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            sh gradlew --no-daemon assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Local OCR tests must work without emulator networking.
            adb shell svc wifi disable
            adb shell svc data disable
            mkdir -p app/build/reports/androidTests/screenshots
            adb shell am instrument -w -r il.sidewalks.reporter.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/reports/androidTests/instrumentation.txt
            python3 scripts/test_summary.py --title 'Instrumented tests (emulator, API 30)' --instrumentation app/build/reports/androidTests/instrumentation.txt --check
            adb shell run-as il.sidewalks.reporter cat files/m0-synthetic.png > app/build/reports/androidTests/screenshots/m0-synthetic.png
            test -s app/build/reports/androidTests/screenshots/m0-synthetic.png
            adb shell run-as il.sidewalks.reporter cat files/m1-review-synthetic.png > app/build/reports/androidTests/screenshots/m1-review-synthetic.png
            adb shell run-as il.sidewalks.reporter cat files/m1-settings-synthetic.png > app/build/reports/androidTests/screenshots/m1-settings-synthetic.png
            test -s app/build/reports/androidTests/screenshots/m1-review-synthetic.png
            test -s app/build/reports/androidTests/screenshots/m1-settings-synthetic.png
            adb shell run-as il.sidewalks.reporter cat files/m1-home-intake-synthetic.png > app/build/reports/androidTests/screenshots/m1-home-intake-synthetic.png
            test -s app/build/reports/androidTests/screenshots/m1-home-intake-synthetic.png
            adb shell run-as il.sidewalks.reporter cat files/m2-ocr-synthetic.png > app/build/reports/androidTests/screenshots/m2-ocr-synthetic.png
            test -s app/build/reports/androidTests/screenshots/m2-ocr-synthetic.png
            adb shell run-as il.sidewalks.reporter cat files/design-home-synthetic.png > app/build/reports/androidTests/screenshots/design-home-synthetic.png
            adb shell run-as il.sidewalks.reporter cat files/design-sign-synthetic.png > app/build/reports/androidTests/screenshots/design-sign-synthetic.png
            test -s app/build/reports/androidTests/screenshots/design-home-synthetic.png
            test -s app/build/reports/androidTests/screenshots/design-sign-synthetic.png
            adb shell run-as il.sidewalks.reporter cat files/design-sign-actions-synthetic.png > app/build/reports/androidTests/screenshots/design-sign-actions-synthetic.png
            adb shell run-as il.sidewalks.reporter cat files/ocr-comparison.json > app/build/reports/androidTests/ocr-comparison.json
            test -s app/build/reports/androidTests/ocr-comparison.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: emulator-test-results
          path: app/build/reports/androidTests/
          retention-days: 14

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [build, emulator]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
