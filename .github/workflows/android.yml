name: Registry status dedicated recording
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recording:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: sh scripts/prepare_wrapper.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record available device profiles
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device'
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            sh gradlew --no-daemon assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            sh gradlew --stop || true
            python3 scripts/emulator_preflight.py --report-dir app/build/reports/display
            mkdir -p app/build/reports/display/screenshots
            adb shell wm size > app/build/reports/display/device.txt
            adb shell wm density >> app/build/reports/display/device.txt
            adb shell settings get system font_scale >> app/build/reports/display/device.txt
            adb shell "screenrecord --time-limit 120 /sdcard/display-test.mp4 >/dev/null 2>&1 &"
            adb shell am instrument -w -r -e class io.github.reihlinstinct.reporter.RegistryStatusVideoTest il.sidewalks.reporter.test/androidx.test.runner.AndroidJUnitRunner > app/build/reports/display/instrumentation.txt 2>&1; echo $? > app/build/reports/display/instrumentation.rc; cat app/build/reports/display/instrumentation.txt
            adb shell pkill -INT screenrecord || true
            sleep 2
            adb pull /sdcard/display-test.mp4 app/build/reports/display/display-test.mp4 || true
            adb logcat -d -v threadtime > app/build/reports/display/logcat.txt || true
            python3 scripts/test_summary.py --title 'Display screenshots (registry-status-video, API36)' --instrumentation app/build/reports/display/instrumentation.txt --check; echo $? > app/build/reports/display/summary.rc
            for f in registry-video-state-0.png registry-video-state-1.png registry-video-state-2.png registry-video-state-3.png registry-video-state-4.png registry-video-state-5.png; do adb shell run-as il.sidewalks.reporter cat "files/$f" > "app/build/reports/display/screenshots/$f"; done
            test "$(cat app/build/reports/display/instrumentation.rc)" = 0
            test "$(cat app/build/reports/display/summary.rc)" = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: display-api36-registry-status-video
          path: app/build/reports/display/
          retention-days: 14
          if-no-files-found: error
