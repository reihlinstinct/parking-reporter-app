name: Read-only registry emulator proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-readonly-proof
  cancel-in-progress: false
jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: sh scripts/prepare_wrapper.sh
      - name: Prepare private plates without logging
        env:
          PLATES: ${{ secrets.REGISTRY_CHECK_PLATES }}
        run: |
          mkdir -p /tmp/registry-proof
          python3 - <<'PY'
          import os,re,pathlib
          plates=os.environ['PLATES'].strip()
          assert re.fullmatch(r'[1-9][0-9]{6,7}(,[1-9][0-9]{6,7}){0,5}',plates)
          pathlib.Path('/tmp/registry-proof/plates.txt').write_text(plates)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '36'
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            sh gradlew --no-daemon assembleDebug assembleDebugAndroidTest > /tmp/registry-proof/build.log 2>&1
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell svc wifi enable
            adb shell svc data enable
            adb shell run-as il.sidewalks.reporter mkdir -p files
            adb shell run-as il.sidewalks.reporter tee files/registry-check-plates.txt < /tmp/registry-proof/plates.txt > /dev/null
            adb shell screenrecord --time-limit 180 /sdcard/registry-proof.mp4 > /dev/null 2>&1 &
            adb shell am instrument -w -r -e class io.github.reihlinstinct.reporter.registry.LiveReadOnlyRegistryTest il.sidewalks.reporter.test/androidx.test.runner.AndroidJUnitRunner > /tmp/registry-proof/instrumentation.txt 2>&1
            adb shell pkill -INT screenrecord || true
            sleep 2
            adb pull /sdcard/registry-proof.mp4 /tmp/registry-proof/recording.mp4 > /dev/null
            adb shell run-as il.sidewalks.reporter cat files/registry-results.json > /tmp/registry-proof/results.json
            for f in $(adb shell run-as il.sidewalks.reporter ls files/ | tr -d '\r' | grep '^registry-proof-.*png$'); do adb shell run-as il.sidewalks.reporter cat files/$f > /tmp/registry-proof/$f; done
            grep -q 'OK (1 test)' /tmp/registry-proof/instrumentation.txt
      - name: Encrypt all private evidence
        if: always()
        env:
          TRIAL_DATA_KEY: ${{ secrets.TRIAL_DATA_KEY }}
        run: |
          tar czf /tmp/registry-proof.tgz -C /tmp/registry-proof .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/registry-proof.tgz -out /tmp/registry-proof.tgz.enc -pass env:TRIAL_DATA_KEY
          rm -rf /tmp/registry-proof /tmp/registry-proof.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: registry-readonly-private-proof-encrypted
          path: /tmp/registry-proof.tgz.enc
          if-no-files-found: error
          retention-days: 3
