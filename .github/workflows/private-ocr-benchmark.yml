name: Private OCR benchmark (no submissions)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type COMPARE-ONLY to compare private staged photos without submitting reports'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: private-ocr-benchmark
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'COMPARE-ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: sh scripts/prepare_wrapper.sh
      - run: sh gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare in emulator with networking disabled
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          OCR_BENCH_INPUT_URL: ${{ secrets.OCR_BENCH_INPUT_URL }}
          OCR_BENCH_INPUT_SHA256: ${{ secrets.OCR_BENCH_INPUT_SHA256 }}
          OCR_BENCH_KEY: ${{ secrets.OCR_BENCH_KEY }}
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run-private-ocr-benchmark.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: private-ocr-results-encrypted
          path: /tmp/ocr-benchmark/results.tar.enc
          if-no-files-found: error
          retention-days: 3
      - name: Cleanup private files
        if: always()
        run: rm -rf /tmp/ocr-benchmark
