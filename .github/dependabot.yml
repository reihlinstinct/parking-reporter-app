version: 2
updates:
  # Android app dependencies (Gradle)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python tooling dependencies (scripts/)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
